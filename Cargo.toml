[package]
name = "rust_mqtt"
version = "0.1.0"
edition = "2021"
description = "MQTT 3.1.1 broker implementado en Rust con Axum y Tokio"
license = "MIT"
repository = "https://github.com/example/rust_mqtt"
readme = "README.md"
keywords = ["mqtt", "broker", "iot", "messaging"]
categories = ["network-programming", "asynchronous"]

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tokio-tungstenite = "0.24"
tungstenite = "0.24"
bytes = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dashmap = "6"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"

[dev-dependencies]
tokio-test = "0.4"
anyhow = "1"

[lints.clippy]
all = { level = "warn", priority = 10 }
unwrap_used = "deny"
expect_used = "deny"

[lints.rust]
unsafe_code = "deny"
